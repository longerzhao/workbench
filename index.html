<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人工作台</title>
    <meta name="description" content="本地优先的个人工作台：待办、笔记、日历、习惯、番茄钟、书签与数据看板" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><path d='M16 7.5l1.9 5.6 5.6 1.9-5.6 1.9L16 22.5l-1.9-5.6L8.5 15l5.6-1.9z' fill='white'/></svg>"
    />
    <script>
      // 在首屏渲染前定好主题，避免深色模式下的白屏闪烁
      (function () {
        try {
          var raw = localStorage.getItem('workbench:ui');
          var theme = raw ? JSON.parse(raw).state.theme : null;
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* 忽略：损坏的 localStorage 不应阻塞应用启动 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
