name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          # 保留上一版的产物：发版瞬间还开着的旧标签页，仍会按旧文件名去取 chunk。
          # 那些文件若被立刻删掉，懒加载就会以
          # "Failed to fetch dynamically imported module" 收场。
          # 应用侧另有一层兜底（chunk 加载失败自动刷新），两者叠加才稳。
          keep_files: true
      - id: deployment
        uses: actions/deploy-pages@v4
